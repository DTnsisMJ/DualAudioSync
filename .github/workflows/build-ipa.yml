name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Setup .NET 9.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.100
      - name: Install MAUI old stable
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload list
          xcodebuild -version
      - name: Build IPA
        run: |
          CSPROJ=$(find . -name "DualAudioSync.csproj" | head -n 1)
          echo "Encontrado: $CSPROJ"
          dotnet restore "$CSPROJ"
          dotnet publish "$CSPROJ" -f net9.0-ios -c Release -p:BuildIpa=True -p:ArchiveOnBuild=True -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-file
          path: "**/*.ipa"
